name = "cloud-mail"
main = "src/index.js"
compatibility_date = "2025-06-04"
keep_vars = true

[observability]
enabled = true

[[d1_databases]]
binding = "db"
database_name = "cloudmail"
database_id = "84bd1a2b-4a2e-4e19-ad63-56a184b47724"

[[kv_namespaces]]
binding = "kv"
id = "e718a7d2c8ef415180b8c7e7c0d386fd"

#[[r2_buckets]]
#binding = "r2"			#r2对象存储绑定名默认不可修改
#bucket_name = ""		#r2对象存储桶的名字

#[[send_email]]
#name = "email"			#CF发件, 配置后优先使用

[ai]
binding = "ai"

[assets]
binding = "assets"		#静态资源绑定名默认不可修改
directory = "./dist"	#前端vue项目打包的静态资源存放位置,默认dist
not_found_handling = "single-page-application"
run_worker_first = true

[triggers]
crons = ["*/30 * * * *", "0 16 * * *"]	#每30分钟刷新分析缓存，每天晚上12点执行每日任务


[vars]
admin = "admin@removebg.help"
domain = ["removebg.help", "videocompress.dev", "heictojpg.click", "deepnatal.com", "squareimage.dev"]
#ai_model = ""			#ai模型,不填默认使用@cf/meta/llama-3.1-8b-instruct
#analysis_cache = false			#是否开启分析数据缓存
#orm_log = false			#是否sql日志
#jwt_secret is uploaded as a Worker secret during deployment.

[build]
command = "pnpm --prefix ../mail-vue install && pnpm --prefix ../mail-vue run build"
